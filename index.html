<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="format-detection" content="telephone=no">
<title>贵湖の高效导航</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cpath d='M13 19a4 4 0 0 1 0-6l3-3a4 4 0 0 1 6 6l-1 1' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M19 13a4 4 0 0 1 0 6l-3 3a4 4 0 0 1-6-6l1-1' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f4f8;
  --panel:#ffffff;
  --panel-2:#f6f7fa;
  --text:#1d222b;
  --muted:#69717f;
  --line:#e3e5ec;
  --accent:#5457e6;
  --accent-soft:#eeedff;
  --danger:#d94b4d;
  --ok:#10b981;
  --warn:#f59e0b;
  --shadow:0 1px 2px rgba(17,24,39,.04), 0 10px 24px -18px rgba(17,24,39,.30);
  --radius:15px;
  --grid:rgba(17,24,39,.055);
  --glow1:rgba(99,102,241,.13);
  --glow2:rgba(14,165,233,.10);
  --glow3:rgba(139,92,246,.09);
  --card-border:rgba(17,24,39,.08);
  --tint1:.10;
  --tint2:.075;
  --on-accent:#ffffff;
  --tint1d:.055;
  --tint2d:.035;
}
/* 深色令牌：自动跟随系统，也可被 data-theme 强制切换 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --panel:#101218; --panel-2:#181b22; --text:#d3d7e0;
    --muted:#8b93a2; --line:#1f232b; --accent:#a7a5ff; --accent-soft:#181a24;
    --danger:#ff6b6d;
    --shadow:0 1px 0 rgba(255,255,255,.02), 0 18px 40px -26px #000;
    --grid:rgba(255,255,255,.05);
    --glow1:rgba(99,102,241,.20);
    --glow2:rgba(34,211,238,.12);
    --glow3:rgba(139,92,246,.18);
    --card-border:rgba(255,255,255,.07);
    --tint1:.20;
    --tint2:.12;
    --on-accent:#0a0b0f;
    --tint1d:.085;
    --tint2d:.05;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#101218; --panel-2:#181b22; --text:#d3d7e0;
  --muted:#8b93a2; --line:#1f232b; --accent:#a7a5ff; --accent-soft:#181a24;
  --danger:#ff6b6d;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 18px 40px -26px #000;
  --grid:rgba(255,255,255,.05);
  --glow1:rgba(99,102,241,.20);
  --glow2:rgba(34,211,238,.12);
  --glow3:rgba(139,92,246,.18);
  --card-border:rgba(255,255,255,.07);
  --tint1:.20;
  --tint2:.12;
  --on-accent:#0a0b0f;
  --tint1d:.085;
  --tint2d:.05;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px),
    radial-gradient(1200px 720px at 8% -12%, var(--glow1), transparent 62%),
    radial-gradient(1000px 640px at 96% 4%, var(--glow2), transparent 64%),
    radial-gradient(900px 780px at 55% 118%, var(--glow3), transparent 66%);
  background-size:28px 28px, 28px 28px, auto, auto, auto;
  background-repeat:repeat, repeat, no-repeat, no-repeat, no-repeat;
  background-attachment:fixed;
  color:var(--text); min-height:100vh;
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,textarea{font:inherit;color:inherit}

/* 背景光晕层：极慢漂移，纯 CSS，不动主线程 */
.fx{
  position:fixed; inset:-16%; z-index:0; pointer-events:none;
  background:
    radial-gradient(38% 32% at 24% 16%, var(--glow1), transparent 70%),
    radial-gradient(36% 30% at 82% 44%, var(--glow2), transparent 72%);
  filter:blur(46px); opacity:.9;
  animation:drift 30s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes drift{
  from{transform:translate3d(-2%,-1.5%,0) rotate(-1deg) scale(1.02)}
  to{transform:translate3d(2%,1.5%,0) rotate(1deg) scale(1.07)}
}
@media (prefers-reduced-motion: reduce){ .fx{animation:none} }
main{position:relative;z-index:1}
footer{position:relative;z-index:1}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:13px 20px;
  background:color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter:blur(18px) saturate(1.2); -webkit-backdrop-filter:blur(18px) saturate(1.2);
  border-bottom:1px solid var(--line);
  padding-top:calc(13px + env(safe-area-inset-top));
}
.topbar::after{
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg, transparent, color-mix(in srgb,var(--accent) 70%, transparent) 22%, rgba(34,211,238,.55) 50%, color-mix(in srgb,var(--accent) 70%, transparent) 78%, transparent);
  opacity:.7;
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.mark{
  width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff;
  box-shadow:0 6px 16px -8px rgba(99,102,241,.9);
}
.mark svg{width:18px;height:18px}
.brand h1{font-size:16px;margin:0;letter-spacing:.3px;white-space:nowrap}
.brand .stats{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.syncchip{
  display:inline-flex;align-items:center;gap:6px;margin-left:4px;height:26px;
  border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:0 10px;font-size:11.5px;color:var(--muted);cursor:default;
}
.syncchip .dot{width:7px;height:7px;border-radius:50%;background:#b9bfcc;flex:0 0 7px}
.syncchip.ok .dot{background:var(--ok)}
.syncchip.syncing .dot{background:var(--warn);animation:pulse 1s infinite}
.syncchip.idle .dot{background:var(--warn)}
.syncchip.offline .dot{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.actions{margin-left:auto;display:flex;align-items:center;gap:9px}
.search{
  display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:0 10px;height:38px;width:270px;
  transition:border-color .15s, box-shadow .15s;
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:15px;height:15px;flex:0 0 15px;opacity:.5}
.search input{border:0;background:transparent;outline:none;width:100%;height:100%;font-size:13.5px}
.search input::-webkit-search-cancel-button{display:none}
.btn{
  height:38px;padding:0 14px;border-radius:11px;border:1px solid transparent;
  background:transparent;cursor:pointer;font-size:13.5px;transition:.15s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 20px -10px var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:var(--line);background:var(--panel)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.icon{width:38px;padding:0;font-size:16px;letter-spacing:1px}
.btn.sm{height:32px;font-size:12.5px;padding:0 11px}

/* ---------- 分类 ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;transition:.15s;
}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 8px 18px -12px var(--accent)}
.chip .n{opacity:.65;margin-left:5px;font-size:11.5px}

/* ---------- 列表 ---------- */
main{padding:12px 20px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(266px,1fr));gap:13px}
.card{
  --bh:240;
  position:relative;
  background:
    linear-gradient(152deg, hsl(var(--bh) 78% 55% / var(--tint1)), transparent 70%),
    radial-gradient(120% 90% at 92% -14%, hsl(var(--bh) 85% 60% / var(--tint2)), transparent 58%),
    var(--panel);
  border:1px solid var(--card-border);
  border-radius:var(--radius);padding:15px 15px 13px;
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.045);
  cursor:pointer;transition:transform .16s, box-shadow .16s, border-color .18s;
  -webkit-tap-highlight-color:transparent;
}
.card.dim{--tint1:var(--tint1d);--tint2:var(--tint2d)}
.card:hover{
  transform:translateY(-2px);
  border-color:hsl(var(--bh) 90% 62% / .45);
  box-shadow:var(--shadow), 0 0 0 1px hsl(var(--bh) 90% 62% / .12);
}
.head{display:flex;gap:11px;align-items:flex-start}
.fav-wrap{position:relative;width:36px;height:36px;flex:0 0 36px}
.fav-fallback{
  position:absolute;inset:0;border-radius:10px;display:grid;place-items:center;
  color:#fff;font-weight:600;font-size:15px;
}
.fav{
  position:absolute;inset:0;width:36px;height:36px;border-radius:10px;padding:4px;
  object-fit:contain;background:hsl(var(--bh) 60% 50% / .12);border:1px solid var(--card-border);
  opacity:0;transition:opacity .2s;
}
.t{min-width:0;flex:1}
body.is-admin .t{padding-right:22px}
.title{
  font-size:14.5px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;
}
.host{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{
  font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.card-tools{position:absolute;top:9px;right:9px;display:none;gap:4px;opacity:0;transition:.15s}
body.is-admin .card-tools{display:flex}
.card:hover .card-tools{opacity:1}
.mini{
  width:26px;height:26px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;display:grid;place-items:center;
  color:var(--muted);font-size:12px;padding:0;
}
.mini:hover{color:var(--text);background:var(--panel-2)}
.mini.del:hover{color:#fff;background:var(--danger);border-color:var(--danger)}

/* ---------- 空状态 ---------- */
.empty{
  text-align:center;padding:64px 20px;color:var(--muted);border:1px dashed var(--line);
  border-radius:var(--radius);background:var(--panel);
}
.empty .big{font-size:32px;margin-bottom:10px;opacity:.55}
.empty p{margin:5px 0;font-size:13.5px}
.empty .btn{margin-top:14px}

/* ---------- 弹窗 ---------- */
dialog{
  border:1px solid var(--line);border-radius:18px;background:var(--panel);
  color:var(--text);padding:0;width:min(480px,calc(100vw - 24px));
  box-shadow:0 30px 80px -30px rgba(0,0,0,.5);
}
dialog::backdrop{background:rgba(10,12,18,.42);backdrop-filter:blur(3px)}
form{padding:20px 22px 18px}
form h2{font-size:15px;margin:0 0 16px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:12px}
label input,label textarea{
  display:block;width:100%;margin-top:6px;padding:9px 11px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel-2);outline:none;
  font-size:16px;transition:border-color .15s, box-shadow .15s;resize:vertical;
}
@media (min-width:520px){ label input,label textarea{font-size:13.5px} }
label input:focus,label textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:12px}
.sec-title{font-size:12px;color:var(--muted);margin:0 0 8px}
.copyrow{display:flex;gap:8px;margin-bottom:10px}
.copyrow input{
  flex:1;min-width:0;padding:9px 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel-2);font-size:12px;outline:none;
}
.err{color:var(--danger);font-size:12px;margin-top:6px;min-height:16px}

/* ---------- 菜单 ---------- */
.menu{
  position:fixed;z-index:40;min-width:200px;padding:6px;
  background:var(--panel);border:1px solid var(--line);border-radius:13px;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.45);display:none;
}
.menu.show{display:block}
.menu button{
  display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:9px;
  background:transparent;cursor:pointer;font-size:13px;
}
.menu button:hover{background:var(--panel-2)}
.menu .sep{height:1px;background:var(--line);margin:5px 4px}
.menu .danger{color:var(--danger)}
footer{padding:12px 20px 34px;font-size:11.5px;color:var(--muted);line-height:1.75}

/* ---------- 手机 ---------- */
@media (max-width:640px){
  .topbar{padding:11px 14px;gap:10px}
  .brand .stats{display:none}
  .syncchip{padding:0 7px}
  .syncchip .syncText{display:none}
  .actions{margin-left:0;width:100%;gap:8px}
  .search{width:auto;flex:1;min-width:0;height:40px}
  .search input{font-size:16px}
  .btn.icon{width:40px;height:40px}
  #btnAdd{padding:0 13px;height:40px;font-weight:600}
  .chips{padding:2px 0}
  main{padding:11px 14px 6px}
  .grid{grid-template-columns:1fr;gap:11px}
  .card-tools{opacity:1}
  .mini{width:30px;height:30px;font-size:14px}
  body.is-admin .t{padding-right:66px}
  footer{padding:10px 14px 28px}
  .row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="fx" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/>
        <path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/>
      </svg>
    </div>
    <div>
      <h1>贵湖の高效导航</h1>
      <div class="stats" id="stats">0 条链接</div>
    </div>
    <div class="syncchip" id="syncChip" title="同步状态">
      <span class="dot"></span><span class="syncText" id="syncText">只读</span>
    </div>
  </div>
  <div class="actions">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="搜索标题 / 网址 / 标签">
    </div>
    <button class="btn ghost" id="btnAuth">登录</button>
    <button class="btn ghost icon" id="btnMenu" title="更多" aria-label="更多">⋯</button>
    <button class="btn primary" id="btnAdd">＋ 添加</button>
  </div>
</header>

<main>
  <nav class="chips" id="chips"></nav>
  <div class="grid" id="grid"></div>
  <div id="empty"></div>
</main>

<footer id="footer">数据来自云端，所有人可浏览。</footer>

<!-- 添加 / 编辑 -->
<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">添加链接</h2>
    <label>网址
      <input id="fUrl" required placeholder="粘贴网址，不带 https:// 也行" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <label>标题
      <input id="fTitle" placeholder="留空就自动用域名">
    </label>
    <div class="row">
      <label>分类
        <input id="fCat" list="catList" placeholder="如：工具 / 学习">
      </label>
      <label>标签
        <input id="fTags" placeholder="逗号分隔，如：常用,灵感">
      </label>
    </div>
    <label>备注
      <textarea id="fNote" rows="2" placeholder="为什么收藏它？（可留空）"></textarea>
    </label>
    <div class="dlg-foot">
      <button type="button" class="btn ghost" id="btnCancel">取消</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
    <div class="hint">电脑上按 Ctrl+Enter 可直接保存。</div>
    <datalist id="catList"></datalist>
  </form>
</dialog>

<!-- 管理员登录 -->
<dialog id="authDlg">
  <form id="authForm" method="dialog">
    <h2 id="authTitle">管理员登录</h2>
    <div id="authBody"></div>
    <div class="dlg-foot">
      <button type="button" class="btn ghost" id="authClose">关闭</button>
    </div>
  </form>
</dialog>

<div class="menu" id="menu">
  <button data-act="theme" id="menuTheme">切换到深色</button>
  <div class="sep" data-admin="1"></div>
  <button data-act="export" data-admin="1">导出备份（JSON）</button>
  <button data-act="import" data-admin="1">导入备份（JSON）</button>
  <div class="sep" data-admin="1"></div>
  <button data-act="clear" class="danger" data-admin="1">清空全部链接</button>
</div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var CFG = window.LINKS_CONFIG || {};
  var KEY = 'links-data-v2';
  var OUTBOX_KEY = 'links.outbox';
  var AUTH_KEY = 'links.auth';

  var SPACE = CFG.defaultSpace || '';
  var AUTH = loadJson(AUTH_KEY, null);
  var links = loadJson(KEY, []);
  if (!Array.isArray(links)) links = [];
  var outbox = loadJson(OUTBOX_KEY, []);
  if (!Array.isArray(outbox)) outbox = [];
  var q = '';
  var activeCat = '全部';
  var editingId = null;
  var syncBusy = false;
  var syncTimer = null;

  var el = {
    stats: document.getElementById('stats'),
    search: document.getElementById('search'),
    btnAdd: document.getElementById('btnAdd'),
    btnAuth: document.getElementById('btnAuth'),
    btnMenu: document.getElementById('btnMenu'),
    chips: document.getElementById('chips'),
    grid: document.getElementById('grid'),
    empty: document.getElementById('empty'),
    footer: document.getElementById('footer'),
    syncChip: document.getElementById('syncChip'),
    syncText: document.getElementById('syncText'),
    authDlg: document.getElementById('authDlg'),
    authBody: document.getElementById('authBody'),
    authTitle: document.getElementById('authTitle'),
    authForm: document.getElementById('authForm'),
    authClose: document.getElementById('authClose'),
    dlg: document.getElementById('dlg'),
    dlgTitle: document.getElementById('dlgTitle'),
    form: document.getElementById('form'),
    fUrl: document.getElementById('fUrl'),
    fTitle: document.getElementById('fTitle'),
    fCat: document.getElementById('fCat'),
    fTags: document.getElementById('fTags'),
    fNote: document.getElementById('fNote'),
    catList: document.getElementById('catList'),
    btnCancel: document.getElementById('btnCancel'),
    menu: document.getElementById('menu'),
    file: document.getElementById('file')
  };

  /* ---------------- 存储 ---------------- */
  function loadJson(k, dflt) {
    try {
      var raw = localStorage.getItem(k);
      return raw ? JSON.parse(raw) : dflt;
    } catch (e) { return dflt; }
  }
  function setJson(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { }
  }
  function delKey(k) { try { localStorage.removeItem(k); } catch (e) { } }
  function saveData() { setJson(KEY, links); }
  function saveOutbox() { setJson(OUTBOX_KEY, outbox); }
  function isAdmin() { return !!(AUTH && AUTH.token); }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function normalizeUrl(raw) {
    var u = (raw || '').trim();
    if (!u) return '';
    if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(u)) u = 'https://' + u;
    return u;
  }
  function parseUrl(u) { try { return new URL(u); } catch (e) { return null; } }
  function hostOf(u) {
    var p = parseUrl(u);
    return p ? p.hostname.replace(/^www\./, '') : u;
  }
  function titleFromUrl(u) {
    var p = parseUrl(u);
    if (!p) return u;
    var last = p.pathname.split('/').filter(Boolean).pop() || '';
    last = decodeURIComponent(last).replace(/\.(html?|php|aspx?)$/i, '').replace(/[-_]+/g, ' ');
    return last || p.hostname.replace(/^www\./, '');
  }
  /* 品牌色：常见站点按品牌取色相，其余按域名哈希兜底 */
  var BRAND = {
    'bilibili.com':340,'youtube.com':0,'youtu.be':0,'google.com':217,'baidu.com':230,
    'zhihu.com':206,'weibo.com':40,'douyin.com':345,'tiktok.com':350,'kuaishou.com':350,
    'xiaohongshu.com':350,'weixin.qq.com':145,'qq.com':205,'tencent.com':205,
    'aliyun.com':18,'taobao.com':20,'tmall.com':15,'jd.com':5,'pinduoduo.com':5,
    'meituan.com':45,'dianping.com':45,'github.com':210,'gitlab.com':20,'gitee.com':355,
    'notion.so':250,'notion.site':250,'figma.com':270,'dribbble.com':335,'behance.net':220,
    'unsplash.com':205,'canva.com':265,'openai.com':165,'chatgpt.com':165,
    'midjourney.com':265,'stackoverflow.com':28,'npmjs.com':0,'vercel.com':0,
    'cloudflare.com':25,'bing.com':200,'apple.com':220,'microsoft.com':210,
    'x.com':200,'twitter.com':203,'facebook.com':220,'instagram.com':320,
    'pinterest.com':350,'reddit.com':18,'discord.com':235,'telegram.org':200,
    'whatsapp.com':145,'spotify.com':140,'netflix.com':0,'wikipedia.org':240,
    'medium.com':0,'producthunt.com':10,'juejin.cn':210,'csdn.net':215
  };
  function brandOf(host) {
    var h = String(host || '').toLowerCase();
    for (var k in BRAND) {
      if (h === k || h === 'www.' + k || h.indexOf('.' + k) !== -1 || h.indexOf(k + '.') === 0) {
        return { hue: BRAND[k], known: true };
      }
    }
    var x = 0;
    for (var i = 0; i < h.length; i++) x = (x * 31 + h.charCodeAt(i)) % 360;
    return { hue: x, known: false };
  }
  function colorFor(s) {
    return 'hsl(' + brandOf(s).hue + ' 72% 46%)';
  }
  function faviconOf(u) {
    var p = parseUrl(u);
    return p ? 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(p.hostname) + '&sz=64' : '';
  }
  function splitTags(s) {
    return (s || '').split(/[,，、]/).map(function (t) { return t.trim(); }).filter(Boolean);
  }

  /* ---------------- 认证 ---------------- */
  function sbUrl(path) { return CFG.supabaseUrl.replace(/\/+$/, '') + path; }
  function apiBase() { return sbUrl('/rest/v1/links'); }
  function readHeaders() {
    return { 'apikey': CFG.supabaseKey, 'Authorization': 'Bearer ' + CFG.supabaseKey, 'Content-Type': 'application/json' };
  }

  function saveAuth(a) {
    AUTH = a;
    if (a) setJson(AUTH_KEY, a); else delKey(AUTH_KEY);
    document.body.classList.toggle('is-admin', !!a);
    el.btnAuth.textContent = a ? '管理' : '登录';
    el.btnAdd.style.display = a ? '' : 'none';
    var items = el.menu.querySelectorAll('[data-admin="1"]');
    for (var i = 0; i < items.length; i++) items[i].style.display = a ? '' : 'none';
    refreshFooter();
  }

  async function refreshTokens() {
    if (!AUTH || !AUTH.refresh) return null;
    try {
      var res = await fetch(sbUrl('/auth/v1/token?grant_type=refresh_token'), {
        method: 'POST',
        headers: { 'apikey': CFG.supabaseKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: AUTH.refresh })
      });
      if (!res.ok) return null;
      var d = await res.json();
      var next = {
        token: d.access_token,
        refresh: d.refresh_token || AUTH.refresh,
        exp: Date.now() / 1000 + (d.expires_in || 3600),
        email: (d.user && d.user.email) || AUTH.email
      };
      saveAuth(next);
      return next.token;
    } catch (e) { return null; }
  }

  async function ensureToken() {
    if (!isAdmin()) return null;
    if (AUTH.exp && AUTH.exp - Date.now() / 1000 < 120) {
      return await refreshTokens();
    }
    return AUTH.token;
  }

  async function login(email, password) {
    var res = await fetch(sbUrl('/auth/v1/token?grant_type=password'), {
      method: 'POST',
      headers: { 'apikey': CFG.supabaseKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    });
    var d = await res.json().catch(function () { return {}; });
    if (!res.ok) {
      throw new Error(d.error_description || d.msg || d.message || '登录失败');
    }
    saveAuth({
      token: d.access_token,
      refresh: d.refresh_token,
      exp: Date.now() / 1000 + (d.expires_in || 3600),
      email: (d.user && d.user.email) || email
    });
  }

  async function authedFetch(url, opts) {
    var token = await ensureToken();
    if (!token) throw new Error('未登录');
    opts.headers = Object.assign({
      'apikey': CFG.supabaseKey,
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    }, opts.headers || {});
    var res = await fetch(url, opts);
    if (res.status === 401) {
      var t2 = await refreshTokens();
      if (t2) {
        opts.headers.Authorization = 'Bearer ' + t2;
        res = await fetch(url, opts);
      }
      if (res.status === 401) {
        saveAuth(null);
        render(); refreshFooter();
        toast('登录已过期，请重新登录');
      }
    }
    return res;
  }

  /* ---------------- 同步 ---------------- */
  function setStatus(s) {
    var map = {
      ok: ['已同步', 'ok'], syncing: ['同步中', 'syncing'], offline: ['离线', 'offline'],
      idle: ['只读', 'idle'], na: ['本地', 'idle']
    };
    var v = map[s] || map.na;
    el.syncText.textContent = v[0];
    el.syncChip.className = 'syncchip ' + v[1];
  }

  function rowOf(l, deleted) {
    return {
      space: SPACE, id: l.id, url: l.url, title: l.title || '',
      cat: l.cat || '', tags: l.tags || [], note: l.note || '',
      ts: l.ts || 0, deleted: !!deleted
    };
  }
  function fromRow(r) {
    return {
      id: r.id, url: r.url, title: r.title || '',
      cat: r.cat || '', tags: Array.isArray(r.tags) ? r.tags : [], note: r.note || '',
      ts: r.ts || 0
    };
  }

  async function syncNow(manual) {
    if (!CFG.supabaseUrl || !SPACE) { setStatus('na'); return; }
    if (syncBusy) return;
    syncBusy = true;
    setStatus('syncing');
    try {
      var res = await fetch(apiBase() + '?space=eq.' + encodeURIComponent(SPACE) +
        '&select=space,id,url,title,cat,tags,note,ts,deleted', { headers: readHeaders() });
      if (!res.ok) throw new Error('拉取失败 HTTP ' + res.status);
      var remote = await res.json();
      reconcile(remote, isAdmin());
      if (isAdmin() && outbox.length) await flushOutbox();
      setStatus('ok');
      if (manual) toast(isAdmin() ? '同步完成' : '已是最新');
    } catch (e) {
      console.warn(e);
      setStatus('offline');
      if (manual) toast('连不上云端：' + (e.message || '网络问题'));
    } finally {
      syncBusy = false;
    }
  }

  function reconcile(remote, canWrite) {
    var byId = {};
    remote.forEach(function (r) { byId[r.id] = r; });
    var localIds = {};
    links.forEach(function (l) { localIds[l.id] = true; });

    var keep = [];
    links.forEach(function (l) {
      var r = byId[l.id];
      if (r && r.deleted) return;
      if (!r) {
        if (canWrite && !inOutbox(l.id)) outbox.push(rowOf(l, false));
        keep.push(l);
        return;
      }
      if ((r.ts || 0) >= (l.ts || 0)) { keep.push(fromRow(r)); }
      else {
        keep.push(l);
        if (canWrite && !inOutbox(l.id)) outbox.push(rowOf(l, false));
      }
    });

    remote.forEach(function (r) {
      if (r.deleted || localIds[r.id]) return;
      keep.push(fromRow(r));
    });

    dedupeByUrl(keep, canWrite);
    links = keep;
    saveData();
    saveOutbox();
    render();
  }

  function dedupeByUrl(list, canWrite) {
    var map = {}, keep = [];
    list.forEach(function (l) {
      var cur = map[l.url];
      if (!cur) { map[l.url] = l; keep.push(l); return; }
      if ((l.ts || 0) > (cur.ts || 0)) {
        map[l.url] = l;
        if (canWrite) outbox.push(rowOf(cur, true));
        var i = keep.indexOf(cur);
        if (i >= 0) keep.splice(i, 1);
        keep.push(l);
      } else if (canWrite) {
        outbox.push(rowOf(l, true));
      }
    });
  }

  async function flushOutbox() {
    if (!outbox.length) return;
    // 同一批次里同一个 id 只能出现一次，否则 PostgREST 会报 21000
    var map = {}, order = [];
    outbox.forEach(function (r) {
      if (!map[r.id]) order.push(r.id);
      map[r.id] = r;
    });
    outbox = order.map(function (id) { return map[id]; });
    saveOutbox();
    var res = await authedFetch(apiBase() + '?on_conflict=space,id', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(outbox)
    });
    if (!res.ok) throw new Error('上传失败 HTTP ' + res.status);
    outbox = [];
    saveOutbox();
  }

  function inOutbox(id) {
    for (var i = 0; i < outbox.length; i++) if (outbox[i].id === id) return true;
    return false;
  }

  function queueSync() {
    if (!SPACE) return;
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { syncTimer = null; syncNow(false); }, 500);
  }

  /* ---------------- 渲染 ---------------- */
  function categories() {
    var map = {};
    links.forEach(function (l) {
      var c = (l.cat || '').trim() || '未分类';
      map[c] = (map[c] || 0) + 1;
    });
    return Object.keys(map).sort(function (a, b) { return map[b] - map[a]; })
      .map(function (c) { return { name: c, count: map[c] }; });
  }

  function renderChips() {
    var cats = categories();
    var html = '<button class="chip' + (activeCat === '全部' ? ' on' : '') + '" data-cat="全部">全部<span class="n">' + links.length + '</span></button>';
    cats.forEach(function (c) {
      html += '<button class="chip' + (activeCat === c.name ? ' on' : '') + '" data-cat="' + esc(c.name) + '">' +
        esc(c.name) + '<span class="n">' + c.count + '</span></button>';
    });
    el.chips.innerHTML = links.length ? html : '';
    el.chips.style.display = links.length ? 'flex' : 'none';
  }

  function visibleLinks() {
    var kw = q.trim().toLowerCase();
    return links.filter(function (l) {
      var cat = (l.cat || '').trim() || '未分类';
      if (activeCat !== '全部' && cat !== activeCat) return false;
      if (!kw) return true;
      var hay = [l.title, l.url, (l.tags || []).join(' '), l.note].join(' ').toLowerCase();
      return hay.indexOf(kw) !== -1;
    }).sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
  }

  function cardHtml(l) {
    var host = hostOf(l.url);
    var m = host.match(/[\u4e00-\u9fa5a-zA-Z0-9]/);
    var letter = m ? m[0].toUpperCase() : '#';
    var fav = faviconOf(l.url);
    var br = brandOf(host);
    return '' +
      '<div class="card' + (br.known ? '' : ' dim') + '" data-id="' + l.id + '" data-url="' + esc(l.url) + '" style="--bh:' + br.hue + '">' +
        '<div class="card-tools">' +
          '<button class="mini" data-act="edit" title="编辑">✎</button>' +
          '<button class="mini del" data-act="del" title="删除">✕</button>' +
        '</div>' +
        '<div class="head">' +
          '<div class="fav-wrap">' +
            '<div class="fav-fallback" style="background:' + colorFor(host) + '">' + esc(letter) + '</div>' +
            (fav ? '<img class="fav" src="' + esc(fav) + '" alt="" loading="lazy" onload="this.style.opacity=1" onerror="this.style.display=\'none\'">' : '') +
          '</div>' +
          '<div class="t">' +
            '<div class="title">' + esc(l.title || host) + '</div>' +
            '<div class="host">' + esc(host) + '</div>' +
          '</div>' +
        '</div>' +
        (l.note ? '<div class="note">' + esc(l.note) + '</div>' : '') +
        ((l.tags && l.tags.length)
          ? '<div class="tags">' + l.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>'
          : '') +
      '</div>';
  }

  function render() {
    var list = visibleLinks();
    var cats = categories();
    el.stats.textContent = links.length ? links.length + ' 条 · ' + (cats.length || 0) + ' 个分类' : '还没有链接';
    renderChips();
    el.grid.innerHTML = list.map(cardHtml).join('');
    el.grid.style.display = list.length ? 'grid' : 'none';

    if (!list.length) {
      el.empty.innerHTML = links.length
        ? '<div class="empty"><div class="big">🔍</div><p>没有匹配的链接</p><p>换个关键词，或点「全部」回到完整列表。</p></div>'
        : '<div class="empty"><div class="big">🔗</div><p>导航库还是空的</p>' +
          (isAdmin() ? '<p>点右上角「＋ 添加」开始收藏。</p>' : '<p>管理员还没有添加内容。</p>') + '</div>';
    } else {
      el.empty.innerHTML = '';
    }
  }

  function refreshFooter() {
    el.footer.textContent = isAdmin()
      ? '你已登录为管理员，可以添加、修改、删除链接，改动会同步到云端。'
      : '数据来自云端，任何人可浏览，只有管理员登录后才能添加或修改。';
  }

  /* ---------------- 增删改 ---------------- */
  function openDialog(id) {
    if (!isAdmin()) { openAuth(); return; }
    editingId = id || null;
    var l = null;
    if (id) {
      for (var i = 0; i < links.length; i++) { if (links[i].id === id) l = links[i]; }
    }
    el.dlgTitle.textContent = l ? '编辑链接' : '添加链接';
    el.fUrl.value = l ? l.url : '';
    el.fTitle.value = l ? (l.title || '') : '';
    el.fCat.value = l ? (l.cat || '') : (activeCat !== '全部' ? activeCat : '');
    el.fTags.value = l ? (l.tags || []).join(', ') : '';
    el.fNote.value = l ? (l.note || '') : '';
    el.catList.innerHTML = categories().map(function (c) { return '<option value="' + esc(c.name) + '">'; }).join('');
    el.dlg.showModal();
    setTimeout(function () { el.fUrl.focus(); }, 30);
  }

  function submitForm() {
    if (!isAdmin()) return;
    var url = normalizeUrl(el.fUrl.value);
    if (!url) { el.fUrl.focus(); return; }
    var title = el.fTitle.value.trim() || titleFromUrl(url);
    var cat = el.fCat.value.trim();
    var tags = splitTags(el.fTags.value);
    var note = el.fNote.value.trim();
    var ts = Date.now();

    if (editingId) {
      links.forEach(function (l) {
        if (l.id === editingId) {
          l.url = url; l.title = title; l.cat = cat; l.tags = tags; l.note = note; l.ts = ts;
          outbox.push(rowOf(l, false));
        }
      });
    } else {
      var item = { id: uid(), url: url, title: title, cat: cat, tags: tags, note: note, ts: ts };
      links.push(item);
      outbox.push(rowOf(item, false));
    }
    saveData(); saveOutbox();
    if (!editingId) activeCat = '全部';
    render();
    el.dlg.close();
    queueSync();
  }

  function removeLink(id) {
    if (!isAdmin()) return;
    var target = null;
    links.forEach(function (l) { if (l.id === id) target = l; });
    if (!target) return;
    if (!confirm('删除「' + (target.title || hostOf(target.url)) + '」？')) return;
    outbox.push(rowOf(target, true));
    links = links.filter(function (l) { return l.id !== id; });
    saveData(); saveOutbox();
    render();
    queueSync();
  }

  /* ---------------- 交互 ---------------- */
  el.search.addEventListener('input', function () { q = this.value; render(); });
  el.search.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { this.value = ''; q = ''; render(); }
  });
  el.btnAdd.addEventListener('click', function () { openDialog(null); });

  el.chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    activeCat = b.getAttribute('data-cat');
    render();
  });

  el.grid.addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (!card) return;
    var act = e.target.closest('[data-act]');
    var id = card.getAttribute('data-id');
    if (act && isAdmin()) {
      e.stopPropagation();
      var a = act.getAttribute('data-act');
      if (a === 'edit') { openDialog(id); return; }
      if (a === 'del') { removeLink(id); return; }
      return;
    }
    window.open(card.getAttribute('data-url'), '_blank', 'noopener');
  });

  el.form.addEventListener('submit', function (e) { e.preventDefault(); submitForm(); });
  el.form.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitForm(); }
  });
  el.btnCancel.addEventListener('click', function () { el.dlg.close(); });
  el.dlg.addEventListener('click', function (e) { if (e.target === el.dlg) el.dlg.close(); });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault(); el.search.focus(); el.search.select();
    }
    if (e.key === 'Escape') el.menu.classList.remove('show');
  });

  /* ---------------- 菜单 ---------------- */
  el.btnMenu.addEventListener('click', function (e) {
    e.stopPropagation();
    if (el.menu.classList.contains('show')) { el.menu.classList.remove('show'); return; }
    el.menu.classList.add('show');
    var r = this.getBoundingClientRect();
    el.menu.style.left = 'auto';
    el.menu.style.top = Math.min(r.bottom + 8, window.innerHeight - el.menu.offsetHeight - 12) + 'px';
    el.menu.style.right = (document.body.clientWidth - r.right) + 'px';
  });

  document.addEventListener('click', function (e) {
    if (!el.menu.contains(e.target) && e.target !== el.btnMenu) el.menu.classList.remove('show');
  });

  el.menu.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var a = b.getAttribute('data-act');
    el.menu.classList.remove('show');
    if (a === 'export') { if (isAdmin()) exportJson(); }
    else if (a === 'theme') toggleTheme();
    else if (a === 'import') { if (isAdmin()) el.file.click(); }
    else if (a === 'clear') {
      if (!isAdmin() || !links.length) return;
      if (!confirm('清空全部 ' + links.length + ' 条链接？不可恢复，建议先导出备份。')) return;
      links.forEach(function (l) { outbox.push(rowOf(l, true)); });
      links = [];
      saveData(); saveOutbox();
      activeCat = '全部'; q = ''; el.search.value = '';
      render();
      queueSync();
    }
  });

  /* ---------------- 登录弹窗 ---------------- */
  function openAuth() {
    if (isAdmin()) {
      el.authTitle.textContent = '管理员';
      el.authBody.innerHTML =
        '<div class="sec-title">当前登录</div>' +
        '<div class="copyrow"><input value="' + esc(AUTH.email || '') + '" readonly></div>' +
        '<div class="hint" style="margin-top:0">你可以添加、修改、删除链接，改动会同步给所有人。</div>' +
        '<div class="dlg-foot" style="justify-content:flex-start;margin-top:10px">' +
        '<button type="button" class="btn ghost sm" id="btnLogout">退出登录</button>' +
        '<button type="button" class="btn ghost sm" id="btnSyncNow">立即同步</button></div>';
      el.authDlg.showModal();
      bindClick('btnLogout', function () {
        saveAuth(null); render(); el.authDlg.close(); toast('已退出登录');
      });
      bindClick('btnSyncNow', function () { el.authDlg.close(); syncNow(true); });
      return;
    }

    el.authTitle.textContent = '管理员登录';
    el.authBody.innerHTML =
      '<label>邮箱<input id="aEmail" type="email" autocomplete="username" placeholder="管理员邮箱"></label>' +
      '<label>密码<input id="aPwd" type="password" autocomplete="current-password" placeholder="密码"></label>' +
      '<div class="err" id="aErr"></div>' +
      '<div class="dlg-foot" style="justify-content:flex-start;margin-top:4px">' +
      '<button type="button" class="btn primary sm" id="btnLogin">登录</button></div>' +
      '<div class="hint">只有管理员能添加和修改，访客打开就是只读浏览。</div>';
    el.authDlg.showModal();
    bindClick('btnLogin', doLogin);
    var pw = document.getElementById('aPwd');
    pw.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
    });
  }

  async function doLogin() {
    var email = (document.getElementById('aEmail') || {}).value || '';
    var pwd = (document.getElementById('aPwd') || {}).value || '';
    var errBox = document.getElementById('aErr');
    email = email.trim();
    if (!email || !pwd) { if (errBox) errBox.textContent = '请填写邮箱和密码'; return; }
    var btn = document.getElementById('btnLogin');
    if (btn) { btn.disabled = true; btn.textContent = '登录中…'; }
    try {
      await login(email, pwd);
      el.authDlg.close();
      render(); refreshFooter();
      toast('登录成功，现在可以编辑了');
      syncNow(true);
    } catch (e) {
      if (errBox) errBox.textContent = e.message || '登录失败';
      if (btn) { btn.disabled = false; btn.textContent = '登录'; }
    }
  }

  function bindClick(id, fn) {
    var n = document.getElementById(id);
    if (n) n.addEventListener('click', fn);
  }

  el.btnAuth.addEventListener('click', openAuth);
  el.authClose.addEventListener('click', function () { el.authDlg.close(); });
  el.authDlg.addEventListener('click', function (e) { if (e.target === el.authDlg) el.authDlg.close(); });
  el.syncChip.addEventListener('click', function () { syncNow(true); });

  /* ---------------- 备份 ---------------- */
  function exportJson() {
    var payload = { app: 'links-site', version: 3, exportedAt: new Date().toISOString(), links: links };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    a.href = url;
    a.download = 'links-' + d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  el.file.addEventListener('change', function () {
    if (!isAdmin()) return;
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data = null;
      try { data = JSON.parse(reader.result); } catch (err) { data = null; }
      var incoming = Array.isArray(data) ? data : (data && Array.isArray(data.links) ? data.links : null);
      if (!incoming) { alert('这个文件不是有效的备份 JSON。'); return; }
      var exist = {};
      links.forEach(function (l) { exist[l.url] = true; });
      var added = 0;
      incoming.forEach(function (l) {
        if (!l || typeof l.url !== 'string' || exist[l.url]) return;
        exist[l.url] = true;
        var item = {
          id: uid(), url: l.url,
          title: l.title || titleFromUrl(l.url),
          cat: l.cat || '',
          tags: Array.isArray(l.tags) ? l.tags : [],
          note: l.note || '',
          ts: Date.now()
        };
        links.push(item);
        outbox.push(rowOf(item, false));
        added++;
      });
      saveData(); saveOutbox();
      render(); queueSync();
      alert('导入完成，新增 ' + added + ' 条（重复网址已跳过）。');
    };
    reader.readAsText(f);
    this.value = '';
  });

  /* ---------------- 主题 ---------------- */
  var THEME_KEY = 'links.theme';

  function effectiveDark() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function applyTheme(t) {
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    var btn = document.getElementById('menuTheme');
    if (btn) btn.textContent = effectiveDark() ? '切换到浅色' : '切换到深色';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', effectiveDark() ? '#0b0d13' : '#eceff8');
  }

  function toggleTheme() {
    var next = effectiveDark() ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { }
    applyTheme(next);
  }

  function toast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:34px;transform:translateX(-50%);' +
      'background:rgba(24,28,37,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:10px;' +
      'z-index:60;pointer-events:none;opacity:0;transition:opacity .2s;max-width:80vw;text-align:center';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; });
    setTimeout(function () {
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 240);
    }, 1900);
  }

  /* ---------------- 启动 ---------------- */
  var savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) { }
  applyTheme(savedTheme);
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        if (!document.documentElement.getAttribute('data-theme')) applyTheme(null);
      });
    } catch (e) { }
  }
  saveAuth(AUTH);
  render();
  refreshFooter();
  if (CFG.supabaseUrl && SPACE) syncNow(false);

  window.addEventListener('focus', function () { if (CFG.supabaseUrl && SPACE) syncNow(false); });
  window.addEventListener('online', function () { if (CFG.supabaseUrl && SPACE) syncNow(false); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && CFG.supabaseUrl && SPACE) syncNow(false);
  });
  setInterval(function () { if (CFG.supabaseUrl && SPACE && !syncBusy) syncNow(false); }, 45000);
})();
</script>
</body>
</html>
