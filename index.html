<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="format-detection" content="telephone=no">
<title>链接库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cpath d='M13 19a4 4 0 0 1 0-6l3-3a4 4 0 0 1 6 6l-1 1' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M19 13a4 4 0 0 1 0 6l-3 3a4 4 0 0 1-6-6l1-1' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f9;
  --panel:#ffffff;
  --panel-2:#f7f8fc;
  --text:#181c25;
  --muted:#6c7484;
  --line:#e6e8f0;
  --accent:#4f46e5;
  --accent-soft:#ecebff;
  --danger:#d94b4d;
  --ok:#10b981;
  --warn:#f59e0b;
  --shadow:0 1px 2px rgba(17,24,39,.05), 0 12px 30px -16px rgba(17,24,39,.32);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1015; --panel:#171a21; --panel-2:#1c2029; --text:#e7e9ef;
    --muted:#97a0b0; --line:#262b35; --accent:#8b8bff; --accent-soft:#1e2132;
    --danger:#ff6b6d;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -20px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,textarea{font:inherit;color:inherit}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:13px 20px;
  background:color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  padding-top:calc(13px + env(safe-area-inset-top));
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.mark{
  width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff;
  box-shadow:0 6px 16px -8px rgba(99,102,241,.9);
}
.mark svg{width:18px;height:18px}
.brand h1{font-size:16px;margin:0;letter-spacing:.3px;white-space:nowrap}
.brand .stats{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.syncchip{
  display:inline-flex;align-items:center;gap:6px;margin-left:4px;height:26px;
  border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:0 10px;font-size:11.5px;color:var(--muted);cursor:pointer;
}
.syncchip .dot{width:7px;height:7px;border-radius:50%;background:#b9bfcc;flex:0 0 7px}
.syncchip.ok .dot{background:var(--ok)}
.syncchip.syncing .dot{background:var(--warn);animation:pulse 1s infinite}
.syncchip.idle .dot{background:var(--warn)}
.syncchip.offline .dot{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.actions{margin-left:auto;display:flex;align-items:center;gap:9px}
.search{
  display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:0 10px;height:38px;width:270px;
  transition:border-color .15s, box-shadow .15s;
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:15px;height:15px;flex:0 0 15px;opacity:.5}
.search input{border:0;background:transparent;outline:none;width:100%;height:100%;font-size:13.5px}
.search input::-webkit-search-cancel-button{display:none}
.btn{
  height:38px;padding:0 14px;border-radius:11px;border:1px solid transparent;
  background:transparent;cursor:pointer;font-size:13.5px;transition:.15s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 20px -10px var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:var(--line);background:var(--panel)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.icon{width:38px;padding:0;font-size:16px;letter-spacing:1px}
.btn.sm{height:32px;font-size:12.5px;padding:0 11px}

/* ---------- 提示条 ---------- */
.banner{
  margin:12px 20px 0;padding:11px 14px;border:1px solid var(--line);
  background:var(--panel);border-radius:12px;font-size:12.5px;color:var(--muted);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.banner b{color:var(--text);font-weight:600}
.banner .btn{margin-left:auto}

/* ---------- 分类 ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:13px 20px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;transition:.15s;
}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px -12px var(--accent)}
.chip .n{opacity:.65;margin-left:5px;font-size:11.5px}

/* ---------- 列表 ---------- */
main{padding:12px 20px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(266px,1fr));gap:13px}
.card{
  position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:15px 15px 13px;box-shadow:var(--shadow);
  cursor:pointer;transition:transform .16s, box-shadow .16s, border-color .16s;
  -webkit-tap-highlight-color:transparent;
}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%, var(--line))}
.head{display:flex;gap:11px;align-items:flex-start}
.fav-wrap{position:relative;width:36px;height:36px;flex:0 0 36px}
.fav-fallback{
  position:absolute;inset:0;border-radius:10px;display:grid;place-items:center;
  color:#fff;font-weight:600;font-size:15px;
}
.fav{
  position:absolute;inset:0;width:36px;height:36px;border-radius:10px;padding:4px;
  object-fit:contain;background:var(--panel-2);border:1px solid var(--line);
  opacity:0;transition:opacity .2s;
}
.t{min-width:0;flex:1;padding-right:22px}
.title{
  font-size:14.5px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;
}
.host{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{
  font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.card-tools{position:absolute;top:9px;right:9px;display:flex;gap:4px;opacity:0;transition:.15s}
.card:hover .card-tools{opacity:1}
.mini{
  width:26px;height:26px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;display:grid;place-items:center;
  color:var(--muted);font-size:12px;padding:0;
}
.mini:hover{color:var(--text);background:var(--panel-2)}
.mini.del:hover{color:#fff;background:var(--danger);border-color:var(--danger)}

/* ---------- 空状态 ---------- */
.empty{
  text-align:center;padding:64px 20px;color:var(--muted);border:1px dashed var(--line);
  border-radius:var(--radius);background:var(--panel);
}
.empty .big{font-size:32px;margin-bottom:10px;opacity:.55}
.empty p{margin:5px 0;font-size:13.5px}
.empty .btn{margin-top:14px}

/* ---------- 弹窗 ---------- */
dialog{
  border:1px solid var(--line);border-radius:18px;background:var(--panel);
  color:var(--text);padding:0;width:min(480px,calc(100vw - 24px));
  box-shadow:0 30px 80px -30px rgba(0,0,0,.5);
}
dialog::backdrop{background:rgba(10,12,18,.42);backdrop-filter:blur(3px)}
form{padding:20px 22px 18px}
form h2{font-size:15px;margin:0 0 16px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:12px}
label input,label textarea{
  display:block;width:100%;margin-top:6px;padding:9px 11px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel-2);outline:none;
  font-size:16px;transition:border-color .15s, box-shadow .15s;resize:vertical;
}
@media (min-width:520px){ label input,label textarea{font-size:13.5px} }
label input:focus,label textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:12px}
.sec{border-top:1px solid var(--line);margin:14px 0 0;padding-top:14px}
.sec-title{font-size:12px;color:var(--muted);margin:0 0 8px}
.copyrow{display:flex;gap:8px;margin-bottom:10px}
.copyrow input{
  flex:1;min-width:0;padding:9px 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel-2);font-size:12px;outline:none;
}

/* ---------- 菜单 ---------- */
.menu{
  position:fixed;z-index:40;min-width:200px;padding:6px;
  background:var(--panel);border:1px solid var(--line);border-radius:13px;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.45);display:none;
}
.menu.show{display:block}
.menu button{
  display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:9px;
  background:transparent;cursor:pointer;font-size:13px;
}
.menu button:hover{background:var(--panel-2)}
.menu .sep{height:1px;background:var(--line);margin:5px 4px}
.menu .danger{color:var(--danger)}
footer{padding:12px 20px 34px;font-size:11.5px;color:var(--muted);line-height:1.75}

/* ---------- 手机 ---------- */
@media (max-width:640px){
  .topbar{padding:11px 14px;gap:10px}
  .brand .stats{display:none}
  .syncchip{padding:0 7px}
  .syncchip .syncText{display:none}
  .actions{margin-left:0;width:100%;gap:8px}
  .search{width:auto;flex:1;min-width:0;height:40px}
  .search input{font-size:16px}
  .btn.icon{width:40px;height:40px}
  #btnAdd{padding:0 13px;height:40px;font-weight:600}
  .banner{margin:10px 14px 0}
  .chips{padding:11px 14px 2px}
  main{padding:11px 14px 6px}
  .grid{grid-template-columns:1fr;gap:11px}
  .card-tools{opacity:1}
  .mini{width:30px;height:30px;font-size:14px}
  .t{padding-right:66px}
  footer{padding:10px 14px 28px}
  .row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/>
        <path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/>
      </svg>
    </div>
    <div>
      <h1>链接库</h1>
      <div class="stats" id="stats">0 条链接</div>
    </div>
    <button class="syncchip" id="syncChip" title="同步设置">
      <span class="dot"></span><span class="syncText" id="syncText">本地</span>
    </button>
  </div>
  <div class="actions">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="搜索标题 / 网址 / 标签">
    </div>
    <button class="btn ghost icon" id="btnMenu" title="更多" aria-label="更多">⋯</button>
    <button class="btn primary" id="btnAdd">＋ 添加</button>
  </div>
</header>

<div class="banner" id="banner" style="display:none"></div>

<nav class="chips" id="chips"></nav>

<main>
  <div class="grid" id="grid"></div>
  <div id="empty"></div>
</main>

<footer id="footer">
  数据保存在当前设备的浏览器里。
</footer>

<!-- 添加 / 编辑 -->
<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">添加链接</h2>
    <label>网址
      <input id="fUrl" required placeholder="粘贴网址，不带 https:// 也行" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <label>标题
      <input id="fTitle" placeholder="留空就自动用域名">
    </label>
    <div class="row">
      <label>分类
        <input id="fCat" list="catList" placeholder="如：工具 / 学习">
      </label>
      <label>标签
        <input id="fTags" placeholder="逗号分隔，如：常用,灵感">
      </label>
    </div>
    <label>备注
      <textarea id="fNote" rows="2" placeholder="为什么收藏它？（可留空）"></textarea>
    </label>
    <div class="dlg-foot">
      <button type="button" class="btn ghost" id="btnCancel">取消</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
    <div class="hint">电脑上按 Ctrl+Enter 可直接保存。</div>
    <datalist id="catList"></datalist>
  </form>
</dialog>

<!-- 同步设置 -->
<dialog id="syncDlg">
  <form method="dialog">
    <h2>同步设置</h2>
    <div id="syncBody"></div>
    <div class="dlg-foot">
      <button type="button" class="btn ghost" id="syncClose">关闭</button>
    </div>
  </form>
</dialog>

<div class="menu" id="menu">
  <button data-act="sync">同步设置</button>
  <div class="sep"></div>
  <button data-act="export">导出备份（JSON）</button>
  <button data-act="import">导入备份（JSON）</button>
  <div class="sep"></div>
  <button data-act="clear" class="danger">清空全部链接</button>
</div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var CFG = window.LINKS_CONFIG || {};
  var KEY = 'links-data-v2';
  var SPACE_KEY = 'links.space';
  var OUTBOX_KEY = 'links.outbox';
  var PALETTE = ['#4f46e5','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6'];

  var links = loadJson(KEY, []);
  if (!Array.isArray(links)) links = [];
  var outbox = loadJson(OUTBOX_KEY, []);
  if (!Array.isArray(outbox)) outbox = [];
  var space = resolveSpace();
  var q = '';
  var activeCat = '全部';
  var editingId = null;
  var syncBusy = false;
  var syncTimer = null;

  var el = {
    stats: document.getElementById('stats'),
    search: document.getElementById('search'),
    btnAdd: document.getElementById('btnAdd'),
    btnMenu: document.getElementById('btnMenu'),
    chips: document.getElementById('chips'),
    grid: document.getElementById('grid'),
    empty: document.getElementById('empty'),
    banner: document.getElementById('banner'),
    footer: document.getElementById('footer'),
    syncChip: document.getElementById('syncChip'),
    syncText: document.getElementById('syncText'),
    syncDlg: document.getElementById('syncDlg'),
    syncBody: document.getElementById('syncBody'),
    syncClose: document.getElementById('syncClose'),
    dlg: document.getElementById('dlg'),
    dlgTitle: document.getElementById('dlgTitle'),
    form: document.getElementById('form'),
    fUrl: document.getElementById('fUrl'),
    fTitle: document.getElementById('fTitle'),
    fCat: document.getElementById('fCat'),
    fTags: document.getElementById('fTags'),
    fNote: document.getElementById('fNote'),
    catList: document.getElementById('catList'),
    btnCancel: document.getElementById('btnCancel'),
    menu: document.getElementById('menu'),
    file: document.getElementById('file')
  };

  /* ---------------- 存储 ---------------- */
  function loadJson(k, dflt) {
    try {
      var raw = localStorage.getItem(k);
      return raw ? JSON.parse(raw) : dflt;
    } catch (e) { return dflt; }
  }
  function setJson(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); }
    catch (e) { alert('保存失败：浏览器不允许写入本地存储（可能处于无痕模式）。'); }
  }
  function saveData() { setJson(KEY, links); }
  function saveOutbox() { setJson(OUTBOX_KEY, outbox); }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function normalizeUrl(raw) {
    var u = (raw || '').trim();
    if (!u) return '';
    if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(u)) u = 'https://' + u;
    return u;
  }
  function parseUrl(u) { try { return new URL(u); } catch (e) { return null; } }
  function hostOf(u) {
    var p = parseUrl(u);
    return p ? p.hostname.replace(/^www\./, '') : u;
  }
  function titleFromUrl(u) {
    var p = parseUrl(u);
    if (!p) return u;
    var last = p.pathname.split('/').filter(Boolean).pop() || '';
    last = decodeURIComponent(last).replace(/\.(html?|php|aspx?)$/i, '').replace(/[-_]+/g, ' ');
    return last || p.hostname.replace(/^www\./, '');
  }
  function colorFor(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973;
    return PALETTE[h % PALETTE.length];
  }
  function faviconOf(u) {
    var p = parseUrl(u);
    return p ? 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(p.hostname) + '&sz=64' : '';
  }
  function splitTags(s) {
    return (s || '').split(/[,，、]/).map(function (t) { return t.trim(); }).filter(Boolean);
  }

  /* ---------------- 同步：基础 ---------------- */
  function cfgReady() { return !!(CFG.supabaseUrl && CFG.supabaseKey); }
  function apiBase() { return CFG.supabaseUrl.replace(/\/+$/, '') + '/rest/v1/links'; }
  function sbHeaders() {
    return {
      'apikey': CFG.supabaseKey,
      'Authorization': 'Bearer ' + CFG.supabaseKey,
      'Content-Type': 'application/json'
    };
  }
  function newSpace() {
    var a = new Uint8Array(16);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  function resolveSpace() {
    var m = /(?:^#|&)s=([A-Za-z0-9_-]+)/.exec(location.hash || '');
    var fromHash = m ? m[1] : null;
    var stored = null;
    try { stored = localStorage.getItem(SPACE_KEY); } catch (e) { }
    if (fromHash) {
      try { localStorage.setItem(SPACE_KEY, fromHash); } catch (e) { }
      return fromHash;
    }
    return stored || null;
  }
  function persistSpace(sp) {
    space = sp;
    try { localStorage.setItem(SPACE_KEY, sp); } catch (e) { }
    try {
      if (location.protocol !== 'file:') {
        history.replaceState(null, '', location.pathname + location.search + '#s=' + sp);
      }
    } catch (e) { }
    refreshChrome();
  }
  function pairLink() {
    var base = location.protocol === 'file:'
      ? location.href.split('#')[0]
      : location.origin + location.pathname + location.search;
    return base + '#s=' + space;
  }

  function setStatus(s) {
    var map = { ok: '已同步', syncing: '同步中', offline: '同步失败', idle: '未绑定', na: '本地' };
    el.syncChip.className = 'syncchip ' + s;
    el.syncText.textContent = map[s] || '本地';
    el.syncChip.title = {
      ok: '已与云端同步，点击查看设置',
      syncing: '正在与云端同步',
      offline: '连不上云端，改动已存在本机，稍后自动重试',
      idle: '这台设备还没绑定同步库，点击绑定',
      na: '当前是本地模式（未配置云端），点击查看说明'
    }[s] || '';
  }

  function rowOf(l, deleted) {
    return {
      space: space, id: l.id, url: l.url, title: l.title || '',
      cat: l.cat || '', tags: l.tags || [], note: l.note || '',
      ts: l.ts || 0, deleted: !!deleted
    };
  }
  function fromRow(r) {
    return {
      id: r.id, url: r.url, title: r.title || '',
      cat: r.cat || '', tags: Array.isArray(r.tags) ? r.tags : [], note: r.note || '',
      ts: r.ts || 0
    };
  }

  /* ---------------- 同步：一次完整往返 ---------------- */
  async function syncNow(manual) {
    if (!cfgReady()) { setStatus('na'); if (manual) openSync(); return; }
    if (!space) { setStatus('idle'); if (manual) openSync(); return; }
    if (syncBusy) return;
    syncBusy = true;
    setStatus('syncing');
    try {
      var res = await fetch(apiBase() + '?space=eq.' + encodeURIComponent(space) +
        '&select=space,id,url,title,cat,tags,note,ts,deleted', { headers: sbHeaders() });
      if (!res.ok) throw new Error('拉取失败 HTTP ' + res.status);
      var remote = await res.json();
      reconcile(remote);
      await flushOutbox();
      setStatus('ok');
      if (manual) toast('同步完成');
    } catch (e) {
      console.warn(e);
      setStatus('offline');
      if (manual) toast('同步失败：' + (e.message || '网络问题'));
    } finally {
      syncBusy = false;
      refreshChrome();
    }
  }

  function reconcile(remote) {
    var byId = {};
    remote.forEach(function (r) { byId[r.id] = r; });
    var localIds = {};
    links.forEach(function (l) { localIds[l.id] = true; });

    var keep = [];
    links.forEach(function (l) {
      var r = byId[l.id];
      if (r && r.deleted) return;                        // 云端的删除
      if (!r) { outbox.push(rowOf(l, false)); keep.push(l); return; }  // 云端还没有 → 上传
      if ((r.ts || 0) >= (l.ts || 0)) { keep.push(fromRow(r)); }        // 云端更新 → 覆盖本机
      else { keep.push(l); outbox.push(rowOf(l, false)); }              // 本机更新 → 上传
    });

    remote.forEach(function (r) {
      if (r.deleted || localIds[r.id]) return;
      keep.push(fromRow(r));
    });

    dedupeByUrl(keep);
    links = keep;
    saveData();
    saveOutbox();
    render();
  }

  // 同一网址只留最新一条，其余标记为云端删除
  function dedupeByUrl(list) {
    var map = {}, keep = [];
    list.forEach(function (l) {
      var cur = map[l.url];
      if (!cur) { map[l.url] = l; keep.push(l); return; }
      if ((l.ts || 0) > (cur.ts || 0)) {
        map[l.url] = l;
        outbox.push(rowOf(cur, true));
        var i = keep.indexOf(cur);
        if (i >= 0) keep.splice(i, 1);
        keep.push(l);
      } else {
        outbox.push(rowOf(l, true));
      }
    });
    return keep;
  }

  async function flushOutbox() {
    if (!outbox.length) return;
    var payload = outbox.slice();
    var res = await fetch(apiBase() + '?on_conflict=space,id', {
      method: 'POST',
      headers: Object.assign({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }, sbHeaders()),
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('上传失败 HTTP ' + res.status);
    outbox = [];
    saveOutbox();
  }

  function queueSync() {
    if (!cfgReady() || !space) { refreshChrome(); return; }
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { syncTimer = null; syncNow(false); }, 600);
  }

  /* ---------------- 渲染 ---------------- */
  function categories() {
    var map = {};
    links.forEach(function (l) {
      var c = (l.cat || '').trim() || '未分类';
      map[c] = (map[c] || 0) + 1;
    });
    return Object.keys(map).sort(function (a, b) { return map[b] - map[a]; })
      .map(function (c) { return { name: c, count: map[c] }; });
  }

  function renderChips() {
    var cats = categories();
    var html = '<button class="chip' + (activeCat === '全部' ? ' on' : '') + '" data-cat="全部">全部<span class="n">' + links.length + '</span></button>';
    cats.forEach(function (c) {
      html += '<button class="chip' + (activeCat === c.name ? ' on' : '') + '" data-cat="' + esc(c.name) + '">' +
        esc(c.name) + '<span class="n">' + c.count + '</span></button>';
    });
    el.chips.innerHTML = links.length ? html : '';
    el.chips.style.display = links.length ? 'flex' : 'none';
  }

  function visibleLinks() {
    var kw = q.trim().toLowerCase();
    return links.filter(function (l) {
      var cat = (l.cat || '').trim() || '未分类';
      if (activeCat !== '全部' && cat !== activeCat) return false;
      if (!kw) return true;
      var hay = [l.title, l.url, (l.tags || []).join(' '), l.note].join(' ').toLowerCase();
      return hay.indexOf(kw) !== -1;
    }).sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
  }

  function cardHtml(l) {
    var host = hostOf(l.url);
    var m = host.match(/[\u4e00-\u9fa5a-zA-Z0-9]/);
    var letter = m ? m[0].toUpperCase() : '#';
    var fav = faviconOf(l.url);
    return '' +
      '<div class="card" data-id="' + l.id + '" data-url="' + esc(l.url) + '">' +
        '<div class="card-tools">' +
          '<button class="mini" data-act="edit" title="编辑">✎</button>' +
          '<button class="mini del" data-act="del" title="删除">✕</button>' +
        '</div>' +
        '<div class="head">' +
          '<div class="fav-wrap">' +
            '<div class="fav-fallback" style="background:' + colorFor(host) + '">' + esc(letter) + '</div>' +
            (fav ? '<img class="fav" src="' + esc(fav) + '" alt="" loading="lazy" onload="this.style.opacity=1" onerror="this.style.display=\'none\'">' : '') +
          '</div>' +
          '<div class="t">' +
            '<div class="title">' + esc(l.title || host) + '</div>' +
            '<div class="host">' + esc(host) + '</div>' +
          '</div>' +
        '</div>' +
        (l.note ? '<div class="note">' + esc(l.note) + '</div>' : '') +
        ((l.tags && l.tags.length)
          ? '<div class="tags">' + l.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>'
          : '') +
      '</div>';
  }

  function render() {
    var list = visibleLinks();
    var cats = categories();

    el.stats.textContent = links.length
      ? links.length + ' 条 · ' + (cats.length || 0) + ' 个分类'
      : '还没有链接';

    renderChips();
    el.grid.innerHTML = list.map(cardHtml).join('');
    el.grid.style.display = list.length ? 'grid' : 'none';

    if (!list.length) {
      if (!links.length) {
        el.empty.innerHTML = '<div class="empty"><div class="big">🔗</div>' +
          '<p>链接库还是空的</p>' +
          '<p>点右上角「＋ 添加」开始收藏。</p>' +
          '<button class="btn ghost" id="btnDemo">先载入几条示例看看</button></div>';
        var demo = document.getElementById('btnDemo');
        if (demo) demo.addEventListener('click', seedDemo);
      } else {
        el.empty.innerHTML = '<div class="empty"><div class="big">🔍</div>' +
          '<p>没有匹配的链接</p><p>换个关键词，或点「全部」回到完整列表。</p></div>';
      }
    } else {
      el.empty.innerHTML = '';
    }
  }

  function refreshChrome() {
    var syncOn = cfgReady() && !!space;
    el.footer.innerHTML = syncOn
      ? '已接入云端同步：改动会自动上传，换设备打开同一个配对链接即可看到同一份链接。'
      : '数据保存在当前设备的浏览器里，不会上传。';

    if (cfgReady() && !space) {
      el.banner.style.display = 'flex';
      el.banner.innerHTML = '<span>这台设备还没绑定同步库，先绑定才能看到云端的链接。</span>' +
        '<button class="btn ghost sm" id="bannerBtn">绑定 / 新建</button>';
      document.getElementById('bannerBtn').onclick = openSync;
    } else {
      el.banner.style.display = 'none';
    }

    if (!cfgReady()) setStatus('na');
    else if (!space) setStatus('idle');
  }

  /* ---------------- 增删改 ---------------- */
  function openDialog(id) {
    editingId = id || null;
    var l = null;
    if (id) {
      for (var i = 0; i < links.length; i++) { if (links[i].id === id) l = links[i]; }
    }
    el.dlgTitle.textContent = l ? '编辑链接' : '添加链接';
    el.fUrl.value = l ? l.url : '';
    el.fTitle.value = l ? (l.title || '') : '';
    el.fCat.value = l ? (l.cat || '') : (activeCat !== '全部' ? activeCat : '');
    el.fTags.value = l ? (l.tags || []).join(', ') : '';
    el.fNote.value = l ? (l.note || '') : '';
    el.catList.innerHTML = categories().map(function (c) { return '<option value="' + esc(c.name) + '">'; }).join('');
    el.dlg.showModal();
    setTimeout(function () { el.fUrl.focus(); }, 30);
  }

  function submitForm() {
    var url = normalizeUrl(el.fUrl.value);
    if (!url) { el.fUrl.focus(); return; }
    var title = el.fTitle.value.trim() || titleFromUrl(url);
    var cat = el.fCat.value.trim();
    var tags = splitTags(el.fTags.value);
    var note = el.fNote.value.trim();
    var ts = Date.now();

    if (editingId) {
      links.forEach(function (l) {
        if (l.id === editingId) {
          l.url = url; l.title = title; l.cat = cat; l.tags = tags; l.note = note; l.ts = ts;
          pushRow(l);
        }
      });
    } else {
      var item = { id: uid(), url: url, title: title, cat: cat, tags: tags, note: note, ts: ts };
      links.push(item);
      pushRow(item);
    }
    saveData();
    if (!editingId) activeCat = '全部';
    render();
    el.dlg.close();
    queueSync();
  }

  function pushRow(l, deleted) {
    if (!cfgReady() || !space) return;
    outbox.push(rowOf(l, deleted));
    saveOutbox();
  }

  /* ---------------- 交互 ---------------- */
  el.search.addEventListener('input', function () { q = this.value; render(); });
  el.search.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { this.value = ''; q = ''; render(); }
  });
  el.btnAdd.addEventListener('click', function () { openDialog(null); });

  el.chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    activeCat = b.getAttribute('data-cat');
    render();
  });

  el.grid.addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (!card) return;
    var act = e.target.closest('[data-act]');
    var id = card.getAttribute('data-id');
    if (act) {
      e.stopPropagation();
      var a = act.getAttribute('data-act');
      if (a === 'edit') { openDialog(id); return; }
      if (a === 'del') { removeLink(id); return; }
      return;
    }
    window.open(card.getAttribute('data-url'), '_blank', 'noopener');
  });

  function removeLink(id) {
    var target = null;
    links.forEach(function (l) { if (l.id === id) target = l; });
    if (!target) return;
    if (!confirm('删除「' + (target.title || hostOf(target.url)) + '」？')) return;
    pushRow(target, true);
    links = links.filter(function (l) { return l.id !== id; });
    saveData();
    render();
    queueSync();
  }

  el.form.addEventListener('submit', function (e) { e.preventDefault(); submitForm(); });
  el.form.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitForm(); }
  });
  el.btnCancel.addEventListener('click', function () { el.dlg.close(); });
  el.dlg.addEventListener('click', function (e) { if (e.target === el.dlg) el.dlg.close(); });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault(); el.search.focus(); el.search.select();
    }
    if (e.key === 'Escape') el.menu.classList.remove('show');
  });

  /* ---------------- 菜单 ---------------- */
  el.btnMenu.addEventListener('click', function (e) {
    e.stopPropagation();
    if (el.menu.classList.contains('show')) { el.menu.classList.remove('show'); return; }
    el.menu.classList.add('show');
    var r = this.getBoundingClientRect();
    el.menu.style.left = 'auto';
    el.menu.style.top = Math.min(r.bottom + 8, window.innerHeight - el.menu.offsetHeight - 12) + 'px';
    el.menu.style.right = (document.body.clientWidth - r.right) + 'px';
  });

  document.addEventListener('click', function (e) {
    if (!el.menu.contains(e.target) && e.target !== el.btnMenu) el.menu.classList.remove('show');
  });

  el.menu.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var a = b.getAttribute('data-act');
    el.menu.classList.remove('show');
    if (a === 'sync') openSync();
    else if (a === 'export') exportJson();
    else if (a === 'import') el.file.click();
    else if (a === 'clear') {
      if (!links.length) return;
      if (!confirm('清空全部 ' + links.length + ' 条链接？不可恢复，建议先导出备份。')) return;
      links.forEach(function (l) { pushRow(l, true); });
      links = [];
      saveData();
      activeCat = '全部'; q = ''; el.search.value = '';
      render();
      queueSync();
    }
  });

  /* ---------------- 同步设置弹窗 ---------------- */
  function openSync() {
    var html = '';
    if (!cfgReady()) {
      html += '<div class="hint" style="margin-top:0">还没有配置云端服务，所以现在只能本地保存。' +
        '把 <b>config.js</b> 里的 <b>supabaseUrl</b> 和 <b>supabaseKey</b> 填上，或让 AI 帮你配置，就是跨设备同步了。</div>';
    } else if (!space) {
      html += '<div class="sec-title">这台设备还没有绑定同步库</div>' +
        '<div class="copyrow"><input id="inSpace" placeholder="粘贴另一台设备的同步码"><button class="btn ghost sm" type="button" id="btnBind">绑定</button></div>' +
        '<div class="hint" style="margin-top:0">或者新建一个同步库：本机的 ' + links.length + ' 条链接会一起上传。</div>' +
        '<div class="dlg-foot" style="justify-content:flex-start;margin-top:10px">' +
        '<button class="btn primary sm" type="button" id="btnNewSpace">新建同步库</button></div>';
    } else {
      html += '<div class="sec-title">配对链接（在其他设备打开它，就会连到同一份数据）</div>' +
        '<div class="copyrow"><input id="inPair" readonly value="' + esc(pairLink()) + '">' +
        '<button class="btn ghost sm" type="button" id="btnCopyPair">复制</button></div>' +
        '<div class="sec-title">同步码</div>' +
        '<div class="copyrow"><input id="inSpaceCode" readonly value="' + esc(space) + '">' +
        '<button class="btn ghost sm" type="button" id="btnCopyCode">复制</button></div>' +
        '<div class="dlg-foot" style="justify-content:space-between;margin-top:6px">' +
        '<button class="btn ghost sm" type="button" id="btnSyncNow">立即同步</button>' +
        '<button class="btn ghost sm" type="button" id="btnUnbind">解除绑定</button></div>' +
        '<div class="hint">链接数据存在你自己的 Supabase 数据库里，前缀随机生成，别人猜不到。别把配对链接发给外人。</div>';
    }
    el.syncBody.innerHTML = html;
    el.syncDlg.showModal();

    bind('btnBind', function () {
      var v = (document.getElementById('inSpace') || {}).value || '';
      v = v.trim();
      if (!v) return;
      var m = /s=([A-Za-z0-9_-]+)/.exec(v);
      persistSpace(m ? m[1] : v);
      el.syncDlg.close();
      render(); refreshChrome(); syncNow(true);
    });
    bind('btnNewSpace', function () {
      persistSpace(newSpace());
      el.syncDlg.close();
      render(); refreshChrome(); syncNow(true);
    });
    bind('btnCopyPair', function () { copyText(document.getElementById('inPair')); });
    bind('btnCopyCode', function () { copyText(document.getElementById('inSpaceCode')); });
    bind('btnSyncNow', function () { el.syncDlg.close(); syncNow(true); });
    bind('btnUnbind', function () {
      if (!confirm('解除后这台设备不再同步，本地链接仍会保留。')) return;
      try { localStorage.removeItem(SPACE_KEY); } catch (e) { }
      space = null;
      el.syncDlg.close();
      refreshChrome();
    });
  }

  function bind(id, fn) {
    var n = document.getElementById(id);
    if (n) n.addEventListener('click', fn);
  }

  function copyText(input) {
    if (!input) return;
    var v = input.value;
    var done = function () { toast('已复制'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(v).then(done, function () { input.select(); document.execCommand('copy'); done(); });
    } else {
      input.select();
      try { document.execCommand('copy'); done(); } catch (e) { alert('请手动复制：' + v); }
    }
  }

  el.syncChip.addEventListener('click', function () { openSync(); });
  el.syncClose.addEventListener('click', function () { el.syncDlg.close(); });

  /* ---------------- 备份 ---------------- */
  function exportJson() {
    var payload = { app: 'links-site', version: 2, exportedAt: new Date().toISOString(), links: links };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    a.href = url;
    a.download = 'links-' + d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  el.file.addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data = null;
      try { data = JSON.parse(reader.result); } catch (err) { data = null; }
      var incoming = Array.isArray(data) ? data : (data && Array.isArray(data.links) ? data.links : null);
      if (!incoming) { alert('这个文件不是有效的备份 JSON。'); return; }
      var exist = {};
      links.forEach(function (l) { exist[l.url] = true; });
      var added = 0;
      incoming.forEach(function (l) {
        if (!l || typeof l.url !== 'string' || exist[l.url]) return;
        exist[l.url] = true;
        var item = {
          id: uid(), url: l.url,
          title: l.title || titleFromUrl(l.url),
          cat: l.cat || '',
          tags: Array.isArray(l.tags) ? l.tags : [],
          note: l.note || '',
          ts: Date.now()
        };
        links.push(item);
        pushRow(item);
        added++;
      });
      saveData(); render(); queueSync();
      alert('导入完成，新增 ' + added + ' 条（重复网址已跳过）。');
    };
    reader.readAsText(f);
    this.value = '';
  });

  function seedDemo() {
    var now = Date.now();
    [
      { url: 'https://www.notion.so', title: 'Notion', cat: '工具', tags: ['笔记'], note: '写文档、做项目管理。' },
      { url: 'https://github.com', title: 'GitHub', cat: '工具', tags: ['代码'], note: '仓库、Issues、Actions。' },
      { url: 'https://www.bilibili.com', title: '哔哩哔哩', cat: '娱乐', tags: ['视频'], note: '教程和纪录片都在这儿看。' },
      { url: 'https://developer.mozilla.org/zh-CN/', title: 'MDN 文档', cat: '学习', tags: ['前端', '文档'], note: '查 API 首选。' }
    ].forEach(function (d, i) {
      var item = { id: uid(), url: d.url, title: d.title, cat: d.cat, tags: d.tags, note: d.note, ts: now - i * 1000 };
      links.push(item);
      pushRow(item);
    });
    saveData(); render(); queueSync();
  }

  function toast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:34px;transform:translateX(-50%);' +
      'background:rgba(24,28,37,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:10px;' +
      'z-index:60;pointer-events:none;opacity:0;transition:opacity .2s';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; });
    setTimeout(function () {
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 240);
    }, 1800);
  }

  /* ---------------- 启动 ---------------- */
  render();
  refreshChrome();
  if (cfgReady() && space) syncNow(false);

  window.addEventListener('focus', function () {
    if (cfgReady() && space) syncNow(false);
  });
  window.addEventListener('online', function () {
    if (cfgReady() && space) syncNow(false);
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && cfgReady() && space) syncNow(false);
  });
  setInterval(function () {
    if (cfgReady() && space && !syncBusy) syncNow(false);
  }, 30000);
})();
</script>
</body>
</html>
